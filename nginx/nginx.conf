events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 80;

        # Frontend App Route
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Internal route for checking auth
        location = /auth/validate {
            internal;
            proxy_pass http://auth_service:3001/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Auth Service Routes
        location /api/auth {
            proxy_pass http://auth_service:3001/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # User Service (Auth Service handles users now)
        location /api/users {
            proxy_pass http://auth_service:3001/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Transaction Service
        location /api/transactions {
            auth_request /auth/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            proxy_pass http://transaction_service:3000/transactions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Product Service (Laravel)
        location /api/products {
            auth_request /auth/validate;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $auth_user_id;

            proxy_pass http://product_service:8000/api/products;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
